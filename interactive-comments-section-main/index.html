<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
	<link rel="stylesheet" href="./style.css">

  <title>Frontend Mentor | Interactive comments section</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <!-- Pull dynamic content from the data.json file -->
	<main>
			<section class="comment-published">
				<section class="comment-published inner">
					<header class="comment-published border">header</header>
					<article class="comment-published content border">content</article>
					<aside class="comment-published vote border">upvote</aside>
					<button class="comment-published reply-button border">reply</button>
			  </section>
			</section>

			<section class="comment-in-progress">
				<section class="comment-in-progress inner">
					<img src="./images/avatars/image-amyrobson.png" alt="user-avatar"
							class="comment-in-progress avatar"></img>
					<textarea class="comment-in-progress"></textarea>
					<button class="comment-in-progress reply-button">REPLY</button>
				</section>
			</section>
	</main>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>
</html>
