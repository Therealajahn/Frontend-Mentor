<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Browser extensions manager UI</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
		:root{
			--neutral-900: hsl(227, 75%, 14%);
			--neutral-800: hsl(226, 25%, 17%);
			--neutral-700: hsl(225, 23%, 24%);
			--neutral-600: hsl(226, 11%, 37%);
			--neutral-300: hsl(0, 0%, 78%);
			--neutral-200: hsl(217, 61%, 90%);
			--neutral-100: hsl(0, 0%, 93%);
			--neutral-0: hsl(200, 60%, 99%);

			--red-400: hsl(3, 86%, 64%);
			--red-500: hsl(3, 71%, 56%);
			--red-700: hsl(3, 77%, 44%);

		}  

		*{
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family:Noto Sans;
			src:url(https://fonts.google.com/noto/specimen/Noto+Sans);
			color: var(--text-color);
		}
		body.lightmode{
			--text-color: var(--neutral-900);
			--box-color: var(--neutral-0);
			--border-color: var(--neutral-200);
			--radio-color: var(--neutral-0);
			--background: linear-gradient(180deg, #EBF2FC 0%, #EEF8F9 100%);
		}
		body.darkmode{
			--text-color: var(--neutral-0);
			--box-color: var(--neutral-800);
			--border-color: var(--neutral-600);
			--radio-color: var(--neutral-700);
			--background: linear-gradient(180deg, #040918 0%, #091540 100%);
		}
		body{
			display: flex;
			flex-direction: column;
			background:var(--background);
			margin-left: 6rem;
			margin-right: 6rem;
		}
		.border{
			border: .2rem solid white;
		}
		.vert-middle{
			display: flex;
			align-items: center;
		}
		.horz-middle{
			display: flex;
	    justify-content: center;
		}

		header{
			display: flex;
			height: 4rem;
			justify-content: space-between;
			background-color: var(--box-color);
			padding: 1rem;
			margin-top: 1rem;
			margin-bottom: 1rem;
			border-radius: .5rem;
		}
		.crop-header-logo{
			height: 3rem;
			width: 3rem;
			overflow: hidden;
		}
		
		.mode-toggle{
			appearance: none;
		}
		label.mode-toggle{
			height: 3rem;
			width: 3rem;
			background-color: var(--neutral-700);
			border-radius: .5rem;
		}
		.mode-toggle:checked + label.mode-toggle > img{
			content:url("./assets/images/icon-moon.svg");
		}
		.mode-toggle:checked + label.mode-toggle{
			background-color: var(--neutral-100);
		}

		section{
			display: flex;
			margin-top: 3rem;
			justify-content: space-between;
		}

		h1{
			font-size: 1.8rem;
		}

		.radio-article{
			display: flex;
			width: 17rem;
			justify-content: space-between;
		}

		.sort-radio{
			appearance: none;
		}

		.sort-radio:checked + label.sort-radio{
			color: var(--neutral-800);
			background-color: var(--red-400);
		}

  	label.sort-radio{
			display: inline-block;      
			text-align: center;
			min-width: 3rem;
			padding: .5rem 1rem .5rem 1rem;
			border-radius: 1.5rem;
			border: .05rem solid var(--border-color);
			background-color: var(--radio-color);
			font-weight: 500;
		}

		main{
     display: flex;
		 flex-wrap: wrap;
		 margin-top: 1rem;
     justify-content: space-between;
		 gap: .7rem;
		}
		.card{
			display:grid;
			grid-template-columns:25% 50% 15%;
			grid-template-rows:20% 60% 20%;
			grid-template-areas: 
				" logo name .    .   " 
				" .    desc desc desc" 
				" remo .    togg .   " ;
			height: 12rem;                
			width: 24.5rem;
			padding: 1rem;
			background-color:var(--box-color); 
			border: .05rem solid var(--border-color);
			border-radius: 1rem;
			flex-grow: 1;
		}
		.logo{
			grid-area:logo;
		}
		.name{
			grid-area: name;
		}
	  .description{
			grid-area: desc;
			font-size: 16px;
		}
	  .remove-button{
			grid-area: remo;
			width: 5rem;
			height: 2rem;
			background-color:var(--box-color); 
			border: .05rem solid var(--border-color);
			border-radius: 1rem;
		}

		.enable-toggle{
			grid-area: togg;
			appearance: none;
			justify-self: end;
			align-self: center;
		}
		label.enable-toggle{
      width: 2rem;
			height: 1rem;
			border-radius: .5rem;
		  /* static color */
      background-color: var(--neutral-600);
			transition: .25s ease-out;
		}
		label.enable-toggle::before{
			content:"";
			display: inline-block;
      width: .95rem;
			height: .95rem;
			margin-bottom: 1rem;
			border-radius: .5rem;
		  /* static color */
			background-color: var(--neutral-0);
			transition: .25s ease-out;
		}
		.enable-toggle:checked + label.enable-toggle{
		  /* static color */
			background-color: var(--red-500);
		}
		.enable-toggle:checked + label.enable-toggle::before{
			margin-left: 1rem;
		}

    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }

		@media(max-width: 575px){
			body{
				margin-left: 5vw;
				margin-right: 5vw;
			}
			section{
				flex-direction: column;
				height: 7rem;
			}
			main{
				align-items: center;
			}
			.card{
				width: 100%; 
			}
		}
  </style>
</head>
<body class="lightmode">

	<header>

			<article class="vert-middle">
				<span class="crop-header-logo vert-middle">
					<img src="./assets/images/logo.svg" alt="extensions-logo">
				</span>
				<h2 class='header-title vert-middle'>Extensions</h2>
			</article>

			<article class="vert-middle">
				<input type="checkbox" class="mode-toggle" id="mode-toggle">
				<label class="mode-toggle vert-middle horz-middle" for="mode-toggle">
						<img src="./assets/images/icon-sun.svg">
				</label>
			</article>

	</header>

  <!-- If you plan to use the JSON file to populate the data dynamically, you can delete the content below -->
		<section>

				<article class="horz-middle vert-middle">
					<h1>Extensions List</h1>	
				</article>
				<article class="horz-middle vert-middle">
					<article class="radio-article">
					
							<input type="radio" class="sort-radio" id="all" name="sort-radio" checked>
							<label class="sort-radio" for="all">
								 All
							</label>

							<input type="radio" class="sort-radio" id="active" name="sort-radio">
							<label class="sort-radio" for="active">
               Active
							</label>

							<input type="radio" class="sort-radio" id="inactive" name="sort-radio">
							<label class="sort-radio" for="inactive">
               Inactive
							</label>				

					</article>
				</article>

		</section>

		<main>
		</main>
 	<script>
			function makeCard(logoURL,headerName,descriptionContent,isActive,index){
				let card = document.createElement('article');
					card.setAttribute('class','card');
				let logo = document.createElement('img');
					logo.setAttribute('src',logoURL);
					card.appendChild(logo);
				let name = document.createElement('h3');
					name.setAttribute('class','name');
					name.innerHTML = headerName;
					card.appendChild(name);
				let description = document.createElement('p');
					description.setAttribute('class','description');
					description.innerHTML = descriptionContent;
					card.appendChild(description);
				let remove = document.createElement('button');
					remove.setAttribute('class','remove-button');
					remove.innerHTML = 'Remove';
					remove.addEventListener('click',() => {
						card.style.display = 'none';
					});
					card.appendChild(remove);
				let checkbox = document.createElement('input');
					checkbox.setAttribute('type','checkbox');
					checkbox.setAttribute('class','enable-toggle');
					checkbox.setAttribute('id',`enable-toggle${index}`);
					if(isActive){
						checkbox.setAttribute('checked','true');
					};
					card.appendChild(checkbox);
				let label = document.createElement('label');
					label.setAttribute('class','enable-toggle');
					label.setAttribute('for',`enable-toggle${index}`);
					card.appendChild(label);

				let main = document.querySelector('main');
				main.appendChild(card);
			};
			fetch('./data.json')
				.then(response => response.json())
				.then(data => {
					console.log(data);
					data.forEach((card,i) => {
						makeCard(
							card.logo,
							card.name,
							card.description,
							card.isActive,
							i
						);
					})
				})
		</script>
		</main>
